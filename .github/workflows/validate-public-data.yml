name: Validar dados públicos

on:
  push:
    branches:
      - main
    paths:
      - "catalog.json"
      - "firmware/**"
      - "regions/**"
      - "weather/**"
      - "scripts/validate_public_repository.py"
      - ".github/workflows/validate-public-data.yml"
  pull_request:
    paths:
      - "catalog.json"
      - "firmware/**"
      - "regions/**"
      - "weather/**"
      - "scripts/validate_public_repository.py"
      - ".github/workflows/validate-public-data.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Catálogos e artefatos
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar publicação
        run: python3 scripts/validate_public_repository.py
